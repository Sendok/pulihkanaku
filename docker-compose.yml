services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: pulihkanaku, POSTGRES_USER: pulihkanaku, POSTGRES_PASSWORD: pulihkanaku }
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pulihkanaku -d pulihkanaku"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio-development-only }
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 5s, retries: 20 }

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minio minio-development-only && mc mb --ignore-existing local/pulihkanaku-private && mc anonymous set none local/pulihkanaku-private"]

  clamav:
    image: clamav/clamav-debian:1.4
    profiles: ["av"]
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamav-data:/var/lib/clamav"]
    healthcheck: { test: ["CMD-SHELL", "clamdcheck.sh"], interval: 30s, timeout: 10s, retries: 20, start_period: 180s }

volumes: { postgres-data: {}, redis-data: {}, minio-data: {}, clamav-data: {} }